<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laporan Data Pakaian - Sistem Rekapitulasi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2canvas untuk Download PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f3efe9;
            background-image: radial-gradient(at 0% 0%, rgba(220, 210, 198, 0.4) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, rgba(205, 193, 179, 0.4) 0px, transparent 50%);
            background-attachment: fixed;
            color: #4a4039;
        }
        .nude-card {
            background: #faf7f2;
            border: 1px solid #e6ded3;
            box-shadow: 0 10px 30px -5px rgba(139, 120, 104, 0.08);
        }
        .export-mode {
            width: 750px !important;
            padding: 40px !important;
            border-radius: 20px !important;
            background: #faf7f2 !important;
        }
        /* Border Tepi & Vertikal untuk Tabel */
        .custom-table th, .custom-table td {
            border-left: 1px solid #e6ded3;
            border-right: 1px solid #e6ded3;
        }
        .custom-table {
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid #e6ded3;
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen font-sans pb-24">

    <!-- 1. LANDING PAGE (Halaman Depan dengan Background Video/GIF Diam & Tombol Mulai) -->
    <div id="landingPage" class="fixed inset-0 z-50 flex items-center justify-center overflow-hidden transition-opacity duration-700">
        <!-- Background Video / GIF (Diam di awal, play saat diklik) -->
        <video id="bgVideo" class="absolute inset-0 w-full h-full object-cover filter brightness-75" muted playsinline preload="auto">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-soft-color-abstract-background-41587-large.mp4" type="video/mp4">
        </video>
        <!-- Overlay Gelap Elegan -->
        <div class="absolute inset-0 bg-[#3d332c]/50 backdrop-blur-sm"></div>

        <!-- Konten Tombol Mulai -->
        <div class="relative z-10 text-center space-y-6 p-6 max-w-md mx-auto">
            <div class="w-16 h-16 mx-auto rounded-3xl bg-[#faf7f2]/20 border border-white/30 flex items-center justify-center text-white shadow-xl">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2m4 0V2m0 2h4m-4 0a2 2 0 10-4 0m4 0a2 2 0 114 0"/></svg>
            </div>
            <div class="space-y-2">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-wide">Sistem Laporan Pakaian</h1>
                <p class="text-xs sm:text-sm text-slate-200">Silakan klik tombol di bawah untuk mulai masuk ke panel rekapitulasi stok.</p>
            </div>
            <button onclick="startApp()" class="w-full bg-[#52796f] hover:bg-[#3f5d54] active:scale-95 text-white font-bold py-3.5 px-8 rounded-2xl shadow-2xl transition-all tracking-wider text-sm sm:text-base border border-white/20">
                Mulai Masuk 🚀
            </button>
        </div>
    </div>

    <!-- Audio Efek Suara Saat Tombol Mulai Ditekan -->
    <audio id="clickSound" preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c7a73167.mp3?filename=button-click-interlocked-10-101.mp3" type="audio/mpeg">
    </audio>

    <!-- 2. HALAMAN UTAMA LAPORAN (Smooth Fade-in setelah tombol mulai diklik) -->
    <div id="mainApp" class="opacity-0 transition-opacity duration-1000 max-w-3xl mx-auto p-3 sm:p-6 md:p-10 space-y-6 hidden">
        
        <!-- Area Kartu Laporan (Bisa didownload jadi PNG) -->
        <div id="reportCard" class="nude-card p-5 sm:p-8 rounded-2xl sm:rounded-3xl space-y-6 relative overflow-hidden">
            
            <!-- Header Kartu -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-5 border-b border-[#e6ded3]">
                <div class="flex items-center gap-3.5 w-full sm:w-auto">
                    <div class="w-12 h-12 rounded-2xl bg-[#eee5dc] border border-[#dcd0c0] flex items-center justify-center text-[#6b5b52] shrink-0 shadow-sm">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2m4 0V2m0 2h4m-4 0a2 2 0 10-4 0m4 0a2 2 0 114 0"/></svg>
                    </div>
                    <div class="flex-1">
                        <!-- Judul Laporan yang Bisa Diedit Langsung -->
                        <input type="text" id="reportTitleInput" value="LAPORAN DATA PAKAIAN" oninput="saveReportTitle(this.value)" class="w-full bg-transparent font-bold text-lg sm:text-2xl tracking-tight text-[#3d332c] focus:outline-none focus:border-b focus:border-[#52796f] transition-all" title="Klik untuk edit judul laporan">
                        <p class="text-xs sm:text-sm text-[#8c7a6b] font-medium mt-0.5">Rekapitulasi Stok / Produksi</p>
                    </div>
                </div>

                <!-- Info Tanggal & Waktu -->
                <div class="bg-[#eee5dc]/60 border border-[#dcd0c0]/60 px-4 py-2.5 rounded-xl text-xs space-y-1 text-[#6b5b52] w-full sm:w-auto">
                    <div class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5 text-[#8c7a6b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                        <span>Tanggal : <strong id="currentDate" class="text-[#3d332c]"></strong></span>
                    </div>
                    <div class="flex items-center gap-2">
                        <svg class="w-3.5 h-3.5 text-[#8c7a6b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        <span>Waktu : <strong id="currentTime" class="text-[#3d332c]"></strong></span>
                    </div>
                </div>
            </div>

            <!-- Tabel Data Pakaian (Dengan Border Samping Tepi & Tanpa Bulatan Warna) -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs sm:text-sm custom-table">
                    <thead>
                        <tr class="bg-[#eee5dc]/90 text-[#6b5b52] border-b border-[#dcd0c0]">
                            <th class="py-3.5 px-4 font-semibold">Nama Barang</th>
                            <th class="py-3.5 px-4 font-semibold">Warna</th>
                            <th class="py-3.5 px-4 font-semibold text-center">Ukuran</th>
                            <th class="py-3.5 px-4 font-semibold text-center">Jumlah (Qty)</th>
                            <th class="py-3.5 px-4 font-semibold text-right action-col">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryList" class="divide-y divide-[#e6ded3]">
                        <!-- Rendered via JS -->
                    </tbody>
                </table>
            </div>

            <!-- Kotak Keterangan Jumlah Total Per-Ukuran (Di luar tabel, posisi bawah) -->
            <div id="sizeSummaryBox" class="bg-[#eee5dc]/40 border border-[#dcd0c0] p-4 rounded-xl space-y-1.5 text-xs text-[#5c4f44]">
                <p class="font-bold text-[#3d332c] mb-1">Keterangan Total Stok per Ukuran:</p>
                <div id="sizeBreakdownList" class="flex flex-wrap gap-4">
                    <!-- Rendered via JS -->
                </div>
            </div>

        </div>

        <!-- Tombol Kontrol Utama di Bawah -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <button onclick="downloadPNG()" class="bg-[#52796f] hover:bg-[#3f5d54] text-white p-3.5 rounded-2xl text-xs sm:text-sm font-semibold transition-all shadow-md flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                Download PNG
            </button>
            <button onclick="openModal('add')" class="bg-[#eee5dc] hover:bg-[#dcd0c0] text-[#4a4039] border border-[#dcd0c0] p-3.5 rounded-2xl text-xs sm:text-sm font-semibold transition-all shadow-sm flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                Tambah Data Barang
            </button>
            <button onclick="resetData()" class="bg-[#e6ded3]/50 hover:bg-[#dcd0c0]/70 text-[#6b5b52] border border-[#dcd0c0] p-3.5 rounded-2xl text-xs sm:text-sm font-semibold transition-all flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Reset Default
            </button>
        </div>

    </div>

    <!-- Modal Form Tambah / Edit -->
    <div id="modal" class="fixed inset-0 bg-[#3d332c]/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="nude-card w-full max-w-md p-6 rounded-2xl shadow-2xl relative space-y-4">
            <div class="flex justify-between items-center border-b border-[#e6ded3] pb-3">
                <h3 id="modalTitle" class="text-base font-bold text-[#3d332c]">Tambah Data Pakaian</h3>
                <button onclick="closeModal()" class="text-[#8c7a6b] hover:text-[#3d332c]">✕</button>
            </div>
            
            <form id="itemForm" onsubmit="saveItem(event)" class="space-y-3.5">
                <input type="hidden" id="itemId">
                
                <div>
                    <label class="block text-xs font-semibold text-[#6b5b52] mb-1">Nama Barang</label>
                    <input type="text" id="itemName" required placeholder="Contoh: Kemeja Toyobo" class="w-full bg-white border border-[#dcd0c0] rounded-xl px-3.5 py-2 text-xs sm:text-sm text-[#3d332c] focus:outline-none focus:border-[#6b5b52]">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-[#6b5b52] mb-1">Warna</label>
                        <input type="text" id="itemColor" required placeholder="Contoh: Mocca / Hitam" class="w-full bg-white border border-[#dcd0c0] rounded-xl px-3.5 py-2 text-xs sm:text-sm text-[#3d332c] focus:outline-none focus:border-[#6b5b52]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-[#6b5b52] mb-1">Ukuran</label>
                        <input type="text" id="itemSize" required placeholder="S, M, L, XL" class="w-full bg-white border border-[#dcd0c0] rounded-xl px-3.5 py-2 text-xs sm:text-sm text-[#3d332c] focus:outline-none focus:border-[#6b5b52]">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#6b5b52] mb-1">Jumlah (Qty)</label>
                    <input type="number" id="itemQty" min="1" required placeholder="15" class="w-full bg-white border border-[#dcd0c0] rounded-xl px-3.5 py-2 text-xs sm:text-sm text-[#3d332c] focus:outline-none focus:border-[#6b5b52]">
                </div>

                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-[#8c7a6b] hover:bg-[#eee5dc]">Batal</button>
                    <button type="submit" class="bg-[#52796f] hover:bg-[#3f5d54] text-white px-5 py-2 rounded-xl text-xs font-semibold shadow-md">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logika Aplikasi -->
    <script>
        const initialData = [
            { id: 1, name: "Kemeja Toyobo", color: "Mocca", size: "M", qty: 15 },
            { id: 2, name: "Kemeja Toyobo", color: "Mocca", size: "L", qty: 20 },
            { id: 3, name: "Kemeja Toyobo", color: "Hitam", size: "XL", qty: 12 },
            { id: 4, name: "Koko Modern", color: "Putih", size: "M", qty: 25 },
            { id: 5, name: "Koko Modern", color: "Biru Navy", size: "L", qty: 18 }
        ];

        let items = JSON.parse(localStorage.getItem('clothing_inventory')) || initialData;
        let savedTitle = localStorage.getItem('clothing_report_title') || "LAPORAN DATA PAKAIAN";
        document.getElementById('reportTitleInput').value = savedTitle;

        // Tanggal & Waktu Realtime
        const now = new Date();
        document.getElementById('currentDate').innerText = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('currentTime').innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        // Fungsi Transisi Mulai (Video/GIF bergerak saat diklik, bunyi suara, fade-in smooth)
        function startApp() {
            const video = document.getElementById('bgVideo');
            const sound = document.getElementById('clickSound');
            const landing = document.getElementById('landingPage');
            const mainApp = document.getElementById('mainApp');

            // Putar video/GIF yang sebelumnya diam
            video.play().catch(e => console.log("Autoplay blocked:", e));
            
            // Putar efek suara klik
            sound.play().catch(e => console.log("Audio blocked:", e));

            // Beri jeda sebentar agar gerakan video terlihat, lalu fade-out landing page & munculkan main app secara smooth
            setTimeout(() => {
                landing.style.opacity = '0';
                setTimeout(() => {
                    landing.style.display = 'none';
                    mainApp.classList.remove('hidden');
                    // Trigger fade-in smooth
                    setTimeout(() => { mainApp.style.opacity = '1'; }, 50);
                }, 700);
            }, 600);
        }

        function saveStorage() {
            localStorage.setItem('clothing_inventory', JSON.stringify(items));
        }

        function saveReportTitle(val) {
            localStorage.setItem('clothing_report_title', val);
        }

        function renderTable() {
            const tbody = document.getElementById('inventoryList');
            const sizeBreakdownList = document.getElementById('sizeBreakdownList');
            tbody.innerHTML = '';
            sizeBreakdownList.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-xs text-[#8c7a6b]">Belum ada data pakaian.</td></tr>`;
                sizeBreakdownList.innerHTML = `<span class="text-xs text-[#8c7a6b]">Belum ada data ukuran.</span>`;
                return;
            }

            // Hitung total per ukuran secara dinamis
            let sizeTotals = {};

            items.forEach(item => {
                const upperSize = item.size.trim().toUpperCase();
                const qty = parseInt(item.qty) || 0;
                sizeTotals[upperSize] = (sizeTotals[upperSize] || 0) + qty;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-[#eee5dc]/40 transition-colors';
                tr.innerHTML = `
                    <td class="py-3 px-4 font-semibold text-[#3d332c]">${item.name}</td>
                    <td class="py-3 px-4 text-[#5c4f44]">${item.color}</td>
                    <td class="py-3 px-4 text-center font-medium text-[#5c4f44]">${item.size}</td>
                    <td class="py-3 px-4 text-center font-bold text-[#52796f]">${item.qty} pcs</td>
                    <td class="py-3 px-4 text-right action-col">
                        <div class="flex items-center justify-end gap-1.5">
                            <button onclick="editItem(${item.id})" class="text-[#8c7a6b] hover:text-[#52796f] p-1" title="Edit">✏️</button>
                            <button onclick="deleteItem(${item.id})" class="text-[#8c7a6b] hover:text-rose-600 p-1" title="Hapus">🗑️</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Render kotak keterangan total per ukuran
            for (let [size, total] of Object.entries(sizeTotals)) {
                const badge = document.createElement('div');
                badge.className = 'bg-white border border-[#dcd0c0] px-3 py-1.5 rounded-lg shadow-sm';
                badge.innerHTML = `<strong>${size}</strong> : <span class="text-[#52796f] font-bold">${total} pcs</span>`;
                sizeBreakdownList.appendChild(badge);
            }
        }

        function openModal(mode, id = null) {
            document.getElementById('modal').classList.remove('hidden');
            if (mode === 'edit' && id) {
                document.getElementById('modalTitle').innerText = 'Edit Data Pakaian';
                const item = items.find(i => i.id === id);
                document.getElementById('itemId').value = item.id;
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemColor').value = item.color;
                document.getElementById('itemSize').value = item.size;
                document.getElementById('itemQty').value = item.qty;
            } else {
                document.getElementById('modalTitle').innerText = 'Tambah Data Pakaian';
                document.getElementById('itemForm').reset();
                document.getElementById('itemId').value = '';
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function saveItem(event) {
            event.preventDefault();
            const id = document.getElementById('itemId').value;
            const name = document.getElementById('itemName').value;
            const color = document.getElementById('itemColor').value;
            const size = document.getElementById('itemSize').value;
            const qty = parseInt(document.getElementById('itemQty').value);

            if (id) {
                const idx = items.findIndex(i => i.id == id);
                items[idx] = { id: parseInt(id), name, color, size, qty };
            } else {
                items.push({ id: Date.now(), name, color, size, qty });
            }

            saveStorage();
            closeModal();
            renderTable();
        }

        function editItem(id) {
            openModal('edit', id);
        }

        function deleteItem(id) {
            if (confirm('Hapus item ini dari rekapitulasi?')) {
                items = items.filter(i => i.id !== id);
                saveStorage();
                renderTable();
            }
        }

        function resetData() {
            if (confirm('Kembalikan ke data awal bawaan?')) {
                items = initialData;
                saveStorage();
                renderTable();
            }
        }

        function downloadPNG() {
            const card = document.getElementById('reportCard');
            const actionCols = document.querySelectorAll('.action-col');
            const titleInput = document.getElementById('reportTitleInput');
            
            // Buat border input title hilang sementara saat di-capture agar bersih
            titleInput.classList.remove('focus:border-b', 'focus:border-[#52796f]');
            actionCols.forEach(el => el.style.display = 'none');
            card.classList.add('export-mode');

            html2canvas(card, {
                backgroundColor: '#faf7f2',
                scale: 3,
                useCORS: true,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Laporan-Pakaian-${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();

                card.classList.remove('export-mode');
                titleInput.classList.add('focus:border-b', 'focus:border-[#52796f]');
                actionCols.forEach(el => el.style.display = '');
            });
        }

        renderTable();
    </script>
</body>
</html>
