<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>catatan akhir zaman</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2canvas untuk Download PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f3efe9;
            background-image: radial-gradient(at 0% 0%, rgba(220, 210, 198, 0.4) 0px, transparent 90%),
                              radial-gradient(at 100% 100%, rgba(205, 193, 179, 0.4) 0px, transparent 90%);
            background-attachment: fixed;
            color: #4a4039;
        }
        .nude-card {
            background: #faf7f2;
            border: 1px solid #e6ded3;
            box-shadow: 0 10px 30px -5px rgba(139, 120, 104, 0.08);
        }
        .export-mode {
            width: 750px !important;
            padding: 40px !important;
            border-radius: 20px !important;
            background: #faf7f2 !important;
        }
        .custom-table th, .custom-table td {
            border-left: 1px solid #e6ded3;
            border-right: 1px solid #e6ded3;
        }
        .custom-table {
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid #e6ded3;
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen font-sans pb-24">

    <!-- 1. LANDING PAGE (Video BG & Tombol Tak Terlihat di Area Oranye) -->
    <div id="landingPage" class="fixed inset-0 z-50 flex items-center justify-center overflow-hidden transition-opacity duration-700 bg-black">
        <video id="bgVideo" class="absolute inset-0 w-full h-full object-cover filter brightness-90" muted playsinline preload="auto" loop>
            <source src="assets/bg.mp4" type="video/mp4">
        </video>
        <!-- Overlay tipis agar video latar belakang terlihat lebih jelas -->
        <div class="absolute inset-0 bg-black/10"></div>

        <!-- Tombol Tak Terlihat di Posisi Area Oranye / Dahi -->
        <button onclick="startApp()" class="absolute z-20 cursor-pointer opacity-0 bg-red-500/20 hover:bg-red-500/40" style="top: 15%; left: 30%; width: 40%; height: 15%;" title="Mulai">
            Mulai
        </button>
    </div>

    <!-- Audio Efek Suara Klik -->
    <audio id="clickSound" preload="auto">
        <source src="assets/bg.mp3" type="audio/mpeg">
    </audio>

    <!-- 2. HALAMAN UTAMA LAPORAN -->
    <div id="mainApp" class="opacity-0 transition-opacity duration-1000 max-w-3xl mx-auto p-3 sm:p-6 md:p-10 space-y-6 hidden">
        
        <div id="reportCard" class="nude-card p-5 sm:p-8 rounded-2xl sm:rounded-3xl space-y-6 relative overflow-hidden">
            
            <!-- Header Kartu & Tombol Tambah Barang di Atas Tabel -->
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-5 border-b border-[#e6ded3]">
                <div class="flex-1 w-full">
                    <input type="text" id="reportTitleInput" value="NAMA" oninput="saveReportTitle(this.value)" class="w-full bg-transparent font-extrabold text-xl sm:text-3xl tracking-tight text-[#3d332c] focus:outline-none focus:border-b focus:border-[#52796f] transition-all" title="Klik untuk edit nama">
                </div>

                <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                    <div class="bg-[#eee5dc]/60 border border-[#dcd0c0]/60 px-3.5 py-2 rounded-xl text-xs space-y-1 text-[#6b5b52] shrink-0">
                        <div class="flex items-center gap-2">
                            <span class="text-[#8c7a6b]">Tanggal:</span>
                            <strong id="currentDate" class="text-[#3d332c]"></strong>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-[#8c7a6b]">Waktu:</span>
                            <strong id="currentTime" class="text-[#3d332c]"></strong>
                        </div>
                    </div>

                    <!-- Tombol Tambah Data Barang (Posisi Atas Tabel) -->
                    <button onclick="openModal('add')" class="action-col bg-[#52796f] hover:bg-[#3f5d54] text-white px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all shadow-md flex items-center justify-center gap-1.5 shrink-0">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                        <span>tambih data</span>
                    </button>
                </div>
            </div>

            <!-- Tabel Data Pakaian -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs sm:text-sm custom-table">
                    <thead>
                        <tr class="bg-[#eee5dc]/90 text-[#6b5b52] border-b border-[#dcd0c0]">
                            <th class="py-3.5 px-4 font-semibold">Nama</th>
                            <th class="py-3.5 px-4 font-semibold">Warna</th>
                            <th class="py-3.5 px-4 font-semibold text-center">Ukuran</th>
                            <th class="py-3.5 px-4 font-semibold text-center">Jumlah (Qty)</th>
                            <th class="py-3.5 px-4 font-semibold text-right action-col">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryList" class="divide-y divide-[#e6ded3]"></tbody>
                </table>
            </div>

            <!-- Keterangan Total Stok per Ukuran -->
            <div id="sizeSummaryBox" class="bg-[#eee5dc]/40 border border-[#dcd0c0] p-4 rounded-xl space-y-2 text-xs text-[#5c4f44]">
                <div class="flex justify-between items-center">
                    <p class="font-bold text-[#3d332c]">jumlah perukuran</p>
                </div>
                <div id="sizeBreakdownList" class="grid grid-cols-2 sm:flex sm:flex-wrap gap-2.5"></div>
            </div>

        </div>

        <!-- Kalkulator Harga Otomatis Khusus Web -->
        <div id="webOnlyPriceSection" class="nude-card p-4 sm:p-5 rounded-2xl space-y-3">
            <div class="flex justify-between items-center border-b border-[#e6ded3] pb-2">
                <h3 class="text-xs sm:text-sm font-bold text-[#3d332c]">jumlah kira kira bebenangan</h3>
                <span class="text-[10px] bg-[#52796f]/10 text-[#52796f] px-2 py-0.5 rounded-full font-semibold">moal kaprint</span>
            </div>
            <p class="text-[11px] text-[#8c7a6b]">harga otomatis:</p>
            
            <div id="priceInputsContainer" class="grid grid-cols-2 sm:grid-cols-4 gap-2.5"></div>

            <div class="pt-2 border-t border-[#e6ded3] flex justify-between items-center text-xs sm:text-sm font-bold text-[#3d332c]">
                <span>perkiraan bebenangan:</span>
                <span id="grandTotalPrice" class="text-emerald-700 text-sm sm:text-base">Rp 0</span>
            </div>
        </div>

        <!-- Tombol Aksi Bawah (Download & Reset) -->
        <div class="grid grid-cols-2 gap-3">
            <button onclick="downloadPNG()" class="bg-[#52796f] hover:bg-[#3f5d54] text-white p-3.5 rounded-2xl text-xs sm:text-sm font-semibold transition-all shadow-md flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                Download laporan
            </button>
            <button onclick="resetData()" class="bg-[#e6ded3]/50 hover:bg-[#dcd0c0]/70 text-[#6b5b52] border border-[#dcd0c0] p-3.5 rounded-2xl text-xs sm:text-sm font-semibold transition-all flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                Reset laporan
            </button>
        </div>

    </div>

    <!-- Modal Form Tambah/Edit Data -->
    <div id="modal" class="fixed inset-0 bg-[#3d332c]/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="nude-card w-full max-w-md p-6 rounded-2xl shadow-2xl relative space-y-4">
            <div class="flex justify-between items-center border-b border-[#e6ded3] pb-3">
                <h3 id="modalTitle" class="text-base font-bold text-[#3d332c]">Tambah Data</h3>
                <button onclick="closeModal()" class="text-[#8c7a6b] hover:text-[#3d332c]">✕</button>
            </div>
            
            <form id="itemForm" onsubmit="saveItem(event)" class="space-y-3.5">
                <input type="hidden" id="itemId">
                
                <div>
                    <label class="block text-xs font-semibold text-[#6b5b52] mb-1">Nama</label>
                    <input type="text" id="itemName" required placeholder="Contoh: Bergo" class="w-full bg-white border border-[#dcd0c0] rounded-xl px-3.5 py-2 text-xs sm:text-sm text-[#3d332c] focus:outline-none focus:border-[#52796f]">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-[#6b5b52] mb-1">Warna</label>
                        <input type="text" id="itemColor" required placeholder="Contoh: Mocca" class="w-full bg-white border border-[#dcd0c0] rounded-xl px-3.5 py-2 text-xs sm:text-sm text-[#3d332c] focus:outline-none focus:border-[#52796f]">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-[#6b5b52] mb-1">Ukuran</label>
                        <input type="text" id="itemSize" required placeholder="S, M, L, XL" class="w-full bg-white border border-[#dcd0c0] rounded-xl px-3.5 py-2 text-xs sm:text-sm text-[#3d332c] focus:outline-none focus:border-[#52796f]">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-[#6b5b52] mb-1">Jumlah (Qty)</label>
                    <input type="number" id="itemQty" min="1" required placeholder="15" class="w-full bg-white border border-[#dcd0c0] rounded-xl px-3.5 py-2 text-xs sm:text-sm text-[#3d332c] focus:outline-none focus:border-[#52796f]">
                </div>

                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-[#8c7a6b] hover:bg-[#eee5dc]">Batal</button>
                    <button type="submit" class="bg-[#52796f] hover:bg-[#3f5d54] text-white px-5 py-2 rounded-xl text-xs font-semibold shadow-md">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logika -->
    <script>
        const initialData = [
         ];

        let items = JSON.parse(localStorage.getItem('clothing_inventory')) || initialData;
        let savedTitle = localStorage.getItem('clothing_report_title') || "NAMA";
        let sizePrices = JSON.parse(localStorage.getItem('clothing_size_prices')) || { "S": 4000, "M": 6000, "L": 7000, "XL": 8000 };

        document.getElementById('reportTitleInput').value = savedTitle;

        const now = new Date();
        document.getElementById('currentDate').innerText = now.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        document.getElementById('currentTime').innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

        function startApp() {
            const video = document.getElementById('bgVideo');
            const sound = document.getElementById('clickSound');
            const landing = document.getElementById('landingPage');
            const mainApp = document.getElementById('mainApp');

            if (video) {
                video.play().catch(e => console.log("Video play prevented:", e));
            }
            if (sound) {
                sound.play().catch(e => console.log("Audio play prevented:", e));
            }

            // Tunggu 0.7 detik sebelum transisi
            setTimeout(() => {
                if (landing) {
                    landing.style.opacity = '0';
                    setTimeout(() => {
                        landing.style.display = 'none';
                        if (mainApp) {
                            mainApp.classList.remove('hidden');
                            setTimeout(() => { mainApp.style.opacity = '1'; }, 50);
                        }
                    }, 700);
                }
            }, 700);
        }

        function saveStorage() {
            localStorage.setItem('clothing_inventory', JSON.stringify(items));
        }

        function saveReportTitle(val) {
            localStorage.setItem('clothing_report_title', val);
        }

        function updatePrice(size, val) {
            sizePrices[size.toUpperCase()] = parseFloat(val) || 0;
            localStorage.setItem('clothing_size_prices', JSON.stringify(sizePrices));
            renderTable();
        }

        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
        }

        function renderTable() {
            const tbody = document.getElementById('inventoryList');
            const sizeBreakdownList = document.getElementById('sizeBreakdownList');
            const priceInputsContainer = document.getElementById('priceInputsContainer');
            
            tbody.innerHTML = '';
            sizeBreakdownList.innerHTML = '';
            priceInputsContainer.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-xs text-[#8c7a6b]">Belum ada data pakaian.</td></tr>`;
                sizeBreakdownList.innerHTML = `<span class="text-xs text-[#8c7a6b]">Belum ada data ukuran.</span>`;
                document.getElementById('grandTotalPrice').innerText = formatRupiah(0);
                return;
            }

            let sizeTotals = {};

            items.forEach(item => {
                const upperSize = item.size.trim().toUpperCase();
                const qty = parseInt(item.qty) || 0;
                sizeTotals[upperSize] = (sizeTotals[upperSize] || 0) + qty;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-[#eee5dc]/40 transition-colors';
                tr.innerHTML = `
                    <td class="py-3 px-4 font-semibold text-[#3d332c]">${item.name}</td>
                    <td class="py-3 px-4 text-[#5c4f44]">${item.color}</td>
                    <td class="py-3 px-4 text-center font-medium text-[#5c4f44]">${item.size}</td>
                    <td class="py-3 px-4 text-center font-bold text-[#52796f]">${item.qty} pcs</td>
                    <td class="py-3 px-4 text-right action-col">
                        <div class="flex items-center justify-end gap-1.5">
                            <button onclick="editItem(${item.id})" class="text-[#8c7a6b] hover:text-[#52796f] p-1" title="Edit">✏️</button>
                            <button onclick="deleteItem(${item.id})" class="text-[#8c7a6b] hover:text-rose-600 p-1" title="Hapus">🗑️</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            let grandTotal = 0;

            for (let [size, total] of Object.entries(sizeTotals)) {
                if (!(size in sizePrices)) sizePrices[size] = 0;
                const unitPrice = sizePrices[size];
                const subTotal = total * unitPrice;
                grandTotal += subTotal;

                const badge = document.createElement('div');
                badge.className = 'bg-white border border-[#dcd0c0] px-3 py-1.5 rounded-lg shadow-sm flex items-center justify-between sm:justify-start gap-3';
                badge.innerHTML = `<span><strong>${size}</strong> : <span class="text-[#52796f] font-bold">${total} pcs</span></span>`;
                sizeBreakdownList.appendChild(badge);

                const priceDiv = document.createElement('div');
                priceDiv.className = 'bg-white border border-[#dcd0c0] p-2.5 rounded-xl space-y-1';
                priceDiv.innerHTML = `
                    <label class="block text-[10px] font-bold text-[#6b5b52]">Harga Satuan (${size})</label>
                    <input type="number" min="0" value="${unitPrice}" oninput="updatePrice('${size}', this.value)" class="w-full bg-[#faf7f2] border border-[#dcd0c0] rounded-lg px-2 py-1 text-xs font-semibold text-[#3d332c] focus:outline-none focus:border-[#52796f]">
                    <p class="text-[9px] text-emerald-700 font-bold">Subtotal: ${formatRupiah(subTotal)}</p>
                `;
                priceInputsContainer.appendChild(priceDiv);
            }

            document.getElementById('grandTotalPrice').innerText = formatRupiah(grandTotal);
        }

        function openModal(mode, id = null) {
            document.getElementById('modal').classList.remove('hidden');
            if (mode === 'edit' && id) {
                document.getElementById('modalTitle').innerText = 'Edit Data Pakaian';
                const item = items.find(i => i.id === id);
                document.getElementById('itemId').value = item.id;
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemColor').value = item.color;
                document.getElementById('itemSize').value = item.size;
                document.getElementById('itemQty').value = item.qty;
            } else {
                document.getElementById('modalTitle').innerText = 'Tambah Data Pakaian';
                document.getElementById('itemForm').reset();
                document.getElementById('itemId').value = '';
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function saveItem(event) {
            event.preventDefault();
            const id = document.getElementById('itemId').value;
            const name = document.getElementById('itemName').value;
            const color = document.getElementById('itemColor').value;
            const size = document.getElementById('itemSize').value;
            const qty = parseInt(document.getElementById('itemQty').value);

            if (id) {
                const idx = items.findIndex(i => i.id == id);
                items[idx] = { id: parseInt(id), name, color, size, qty };
            } else {
                items.push({ id: Date.now(), name, color, size, qty });
            }

            saveStorage();
            closeModal();
            renderTable();
        }

        function editItem(id) {
            openModal('edit', id);
        }

        function deleteItem(id) {
            if (confirm('Hapus item ini dari rekapitulasi?')) {
                items = items.filter(i => i.id !== id);
                saveStorage();
                renderTable();
            }
        }

        function resetData() {
            if (confirm('Kembalikan ke data awal bawaan?')) {
                items = initialData;
                saveStorage();
                renderTable();
            }
        }

        function downloadPNG() {
            const card = document.getElementById('reportCard');
            const actionCols = document.querySelectorAll('.action-col');
            const titleInput = document.getElementById('reportTitleInput');
            const priceSection = document.getElementById('webOnlyPriceSection');
            
            if (priceSection) priceSection.style.display = 'none';
            titleInput.classList.remove('focus:border-b', 'focus:border-[#52796f]');
            actionCols.forEach(el => el.style.display = 'none');
            card.classList.add('export-mode');

            html2canvas(card, {
                backgroundColor: '#faf7f2',
                scale: 3,
                useCORS: true,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Laporan-Pakaian-${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();

                if (priceSection) priceSection.style.display = '';
                card.classList.remove('export-mode');
                titleInput.classList.add('focus:border-b', 'focus:border-[#52796f]');
                actionCols.forEach(el => el.style.display = '');
            });
        }

        renderTable();
    </script>
</body>
</html>
