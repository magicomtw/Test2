<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Inventaris Barang</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2canvas Library untuk Ekspor PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0d1117;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }
        .glass-card {
            background: rgba(22, 27, 34, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-4 sm:p-6 md:p-10 font-sans">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Header & Action Buttons -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 glass-card p-5 sm:p-6 rounded-2xl">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-white tracking-wide">Laporan Inventaris</h1>
                <p class="text-xs sm:text-sm text-slate-400 mt-1">Manajemen & rekap data barang</p>
            </div>
            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="openModal('add')" class="flex-1 sm:flex-initial bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Tambah
                </button>
                <button onclick="downloadPNG()" class="flex-1 sm:flex-initial bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    PNG
                </button>
            </div>
        </div>

        <!-- Printable Report Area -->
        <div id="reportCard" class="glass-card p-4 sm:p-6 rounded-2xl">
            <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-700/50">
                <div>
                    <h2 class="text-base sm:text-lg font-semibold text-white">Daftar Stok Barang</h2>
                    <p class="text-xs text-slate-400" id="currentDate"></p>
                </div>
                <div class="text-right">
                    <span class="text-xs text-slate-400 block">Total Jenis</span>
                    <span id="totalItems" class="text-sm sm:text-base font-bold text-indigo-400">0</span>
                </div>
            </div>

            <!-- Table Container -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs sm:text-sm">
                    <thead>
                        <tr class="text-slate-400 border-b border-slate-800">
                            <th class="pb-3 font-medium">BARANG</th>
                            <th class="pb-3 font-medium">WARNA</th>
                            <th class="pb-3 font-medium">UKURAN</th>
                            <th class="pb-3 font-medium text-center">QTY</th>
                            <th class="pb-3 font-medium text-right action-col">AKSI</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryList" class="divide-y divide-slate-800/60">
                        <!-- Items rendered via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal Form Tambah / Edit -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="glass-card w-full max-w-md p-6 rounded-2xl shadow-2xl relative border border-slate-700">
            <h3 id="modalTitle" class="text-lg font-bold text-white mb-4">Tambah Barang</h3>
            
            <form id="itemForm" onsubmit="saveItem(event)" class="space-y-4">
                <input type="hidden" id="itemId">
                
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nama Barang</label>
                    <input type="text" id="itemName" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Warna</label>
                        <input type="text" id="itemColor" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Ukuran</label>
                        <input type="text" id="itemSize" placeholder="S, M, L, XL" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Jumlah (Qty)</label>
                    <input type="number" id="itemQty" min="1" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex justify-end gap-3 pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-medium text-slate-400 hover:text-white transition-all">Batal</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-xs font-semibold transition-all shadow-lg shadow-indigo-600/30">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Application Logic -->
    <script>
        let items = [
            { id: 1, name: "Koko Modern Adila", color: "Hitam Sage", size: "L", qty: 25 },
            { id: 2, name: "Gamis Premium Silk", color: "Rose Gold", size: "M", qty: 14 },
            { id: 3, name: "Koko Slimfit Basic", color: "Putih Clean", size: "XL", qty: 30 }
        ];

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', {
            day: 'numeric', month: 'long', year: 'numeric'
        });

        function renderTable() {
            const tbody = document.getElementById('inventoryList');
            tbody.innerHTML = '';

            items.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/30 transition-colors';
                tr.innerHTML = `
                    <td class="py-3.5 font-medium text-white">${item.name}</td>
                    <td class="py-3.5 text-slate-300">${item.color}</td>
                    <td class="py-3.5 text-slate-300"><span class="bg-slate-800 border border-slate-700 px-2 py-0.5 rounded text-[10px] font-bold">${item.size}</span></td>
                    <td class="py-3.5 text-center font-bold text-indigo-300">${item.qty}</td>
                    <td class="py-3.5 text-right action-col">
                        <div class="flex items-center justify-end gap-2">
                            <button onclick="editItem(${item.id})" class="text-slate-400 hover:text-indigo-400 p-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <button onclick="deleteItem(${item.id})" class="text-slate-400 hover:text-rose-400 p-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalItems').innerText = items.length;
        }

        function openModal(mode, id = null) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            modal.classList.remove('hidden');

            if (mode === 'edit' && id) {
                const item = items.find(i => i.id === id);
                title.innerText = 'Edit Barang';
                document.getElementById('itemId').value = item.id;
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemColor').value = item.color;
                document.getElementById('itemSize').value = item.size;
                document.getElementById('itemQty').value = item.qty;
            } else {
                title.innerText = 'Tambah Barang';
                document.getElementById('itemForm').reset();
                document.getElementById('itemId').value = '';
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function saveItem(event) {
            event.preventDefault();
            const id = document.getElementById('itemId').value;
            const name = document.getElementById('itemName').value;
            const color = document.getElementById('itemColor').value;
            const size = document.getElementById('itemSize').value;
            const qty = parseInt(document.getElementById('itemQty').value);

            if (id) {
                const index = items.findIndex(i => i.id == id);
                items[index] = { id: parseInt(id), name, color, size, qty };
            } else {
                const newId = Date.now();
                items.push({ id: newId, name, color, size, qty });
            }

            closeModal();
            renderTable();
        }

        function editItem(id) {
            openModal('edit', id);
        }

        function deleteItem(id) {
            if (confirm('Apakah Anda yakin ingin menghapus barang ini?')) {
                items = items.filter(i => i.id !== id);
                renderTable();
            }
        }

        function downloadPNG() {
            const reportElement = document.getElementById('reportCard');
            const actionCols = document.querySelectorAll('.action-col');
            
            // Sembunyikan kolom aksi saat di-capture
            actionCols.forEach(el => el.style.display = 'none');

            html2canvas(reportElement, {
                backgroundColor: '#161b22',
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Laporan-Inventaris-${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                // Tampilkan kembali kolom aksi
                actionCols.forEach(el => el.style.display = '');
            });
        }

        // Render data pertama kali
        renderTable();
    </script>
</body>
</html>
