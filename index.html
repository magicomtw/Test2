<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Laporan Inventaris Barang</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- html2canvas untuk Ekspor PNG HD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0f17;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(168, 85, 247, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .export-mode {
            width: 600px !important;
            padding: 32px !important;
            border-radius: 24px !important;
            background: #111622 !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen p-3 sm:p-6 md:p-10 font-sans pb-24">

    <div class="max-w-3xl mx-auto space-y-4 sm:space-y-6">
        
        <!-- Header Utama -->
        <div class="glass-card p-4 sm:p-6 rounded-2xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <span class="text-[10px] sm:text-xs font-bold tracking-wider uppercase bg-indigo-500/20 text-indigo-400 px-2.5 py-1 rounded-full border border-indigo-500/30">Laporan Digital</span>
                <h1 class="text-lg sm:text-2xl font-extrabold text-white mt-1">Stok & Inventaris</h1>
                <p class="text-xs text-slate-400" id="currentDate"></p>
            </div>
            
            <!-- Tombol Aksi HP -->
            <div class="grid grid-cols-2 gap-2 w-full sm:w-auto">
                <button onclick="openModal('add')" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                    Tambah
                </button>
                <button onclick="downloadPNG()" class="bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    PNG HD
                </button>
            </div>
        </div>

        <!-- Kartu Utama Laporan (Elemen yang di-capture ke PNG) -->
        <div id="reportCard" class="glass-card p-4 sm:p-6 rounded-2xl space-y-4">
            
            <!-- Summary Header Laporan -->
            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                <div>
                    <h2 class="text-sm sm:text-base font-bold text-white">Daftar Barang</h2>
                    <p class="text-[11px] text-slate-400">Ringkasan stok barang yang tersedia</p>
                </div>
                <div class="text-right">
                    <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Total Jenis</span>
                    <span id="totalItems" class="text-base sm:text-lg font-black text-indigo-400">0</span>
                </div>
            </div>

            <!-- Tampilan Kartu Responsif (HP View) -->
            <div id="itemListHP" class="space-y-3 sm:hidden">
                <!-- Content rendered via JS -->
            </div>

            <!-- Tampilan Tabel Modern (Tablet/Desktop View) -->
            <div class="hidden sm:block overflow-x-auto">
                <table class="w-full text-left text-xs sm:text-sm">
                    <thead>
                        <tr class="text-slate-400 border-b border-slate-800/80">
                            <th class="pb-3 font-semibold">NAMA BARANG</th>
                            <th class="pb-3 font-semibold">WARNA</th>
                            <th class="pb-3 font-semibold text-center">UKURAN</th>
                            <th class="pb-3 font-semibold text-center">QTY</th>
                            <th class="pb-3 font-semibold text-right action-col">AKSI</th>
                        </tr>
                    </thead>
                    <tbody id="itemListDesktop" class="divide-y divide-slate-800/50">
                        <!-- Content rendered via JS -->
                    </tbody>
                </table>
            </div>

            <div class="pt-2 text-center border-t border-slate-800/50">
                <p class="text-[10px] text-slate-500">Laporan resmi disunting via Sistem Inventaris Digital</p>
            </div>
        </div>

    </div>

    <!-- Modal Form Tambah / Edit (Optimized for Mobile) -->
    <div id="modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-end sm:items-center justify-center p-0 sm:p-4 z-50 transition-all">
        <div class="glass-card w-full max-w-md p-5 sm:p-6 rounded-t-3xl sm:rounded-2xl border border-slate-700/80 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 id="modalTitle" class="text-base font-bold text-white">Tambah Barang Baru</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            
            <form id="itemForm" onsubmit="saveItem(event)" class="space-y-3">
                <input type="hidden" id="itemId">
                
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nama Barang</label>
                    <input type="text" id="itemName" required placeholder="Contoh: Koko Modern Adila" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Warna</label>
                        <input type="text" id="itemColor" required placeholder="Contoh: Sage Green" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Ukuran</label>
                        <input type="text" id="itemSize" placeholder="S, M, L, XL" required class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Jumlah (Qty)</label>
                    <input type="number" id="itemQty" min="1" required placeholder="0" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2.5 text-xs sm:text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>

                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal()" class="w-1/2 sm:w-auto px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-400 bg-slate-800/50 hover:bg-slate-800">Batal</button>
                    <button type="submit" class="w-1/2 sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow-lg shadow-indigo-600/30">Simpan Data</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic dengan Penyimpanan LocalStorage & PNG Rendering -->
    <script>
        // Data bawaan awal jika belum ada data di browser
        const defaultItems = [
            { id: 1, name: "Koko Modern Adila", color: "Hitam Sage", size: "L", qty: 25 },
            { id: 2, name: "Gamis Premium Silk", color: "Rose Gold", size: "M", qty: 14 },
            { id: 3, name: "Koko Slimfit Basic", color: "Putih Clean", size: "XL", qty: 30 }
        ];

        // Ambil data dari LocalStorage agar tidak hilang saat direfresh/ditutup
        let items = JSON.parse(localStorage.getItem('inventory_data')) || defaultItems;

        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('id-ID', {
            weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
        });

        function saveDataToStorage() {
            localStorage.setItem('inventory_data', JSON.stringify(items));
        }

        function renderData() {
            const containerHP = document.getElementById('itemListHP');
            const containerDesktop = document.getElementById('itemListDesktop');
            
            containerHP.innerHTML = '';
            containerDesktop.innerHTML = '';

            if (items.length === 0) {
                const emptyState = `<p class="text-center py-6 text-xs text-slate-500">Belum ada data barang. Klik tombol Tambah.</p>`;
                containerHP.innerHTML = emptyState;
                containerDesktop.innerHTML = `<tr><td colspan="5">${emptyState}</td></tr>`;
                document.getElementById('totalItems').innerText = '0';
                return;
            }

            items.forEach(item => {
                // Render Tampilan HP (Card Mode)
                const cardHP = document.createElement('div');
                cardHP.className = 'bg-slate-900/60 border border-slate-800 rounded-xl p-3.5 flex justify-between items-center';
                cardHP.innerHTML = `
                    <div class="space-y-1">
                        <h3 class="text-xs font-bold text-white">${item.name}</h3>
                        <div class="flex items-center gap-2 text-[11px] text-slate-400">
                            <span>Warna: <strong class="text-slate-200">${item.color}</strong></span>
                            <span>•</span>
                            <span class="bg-indigo-900/60 text-indigo-300 border border-indigo-700/50 px-1.5 py-0.5 rounded text-[10px] font-bold">${item.size}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <span class="text-[9px] text-slate-500 uppercase block">Qty</span>
                            <span class="text-xs font-extrabold text-emerald-400">${item.qty} pcs</span>
                        </div>
                        <div class="flex items-center gap-1 action-col">
                            <button onclick="editItem(${item.id})" class="text-slate-400 hover:text-indigo-400 p-1.5 bg-slate-800/80 rounded-lg">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <button onclick="deleteItem(${item.id})" class="text-slate-400 hover:text-rose-400 p-1.5 bg-slate-800/80 rounded-lg">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </div>
                `;
                containerHP.appendChild(cardHP);

                // Render Tampilan Desktop (Table Mode)
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/30 transition-colors';
                tr.innerHTML = `
                    <td class="py-3 font-semibold text-white">${item.name}</td>
                    <td class="py-3 text-slate-300">${item.color}</td>
                    <td class="py-3 text-center"><span class="bg-indigo-900/60 text-indigo-300 border border-indigo-700/50 px-2 py-0.5 rounded text-[10px] font-bold">${item.size}</span></td>
                    <td class="py-3 text-center font-bold text-emerald-400">${item.qty}</td>
                    <td class="py-3 text-right action-col">
                        <div class="flex items-center justify-end gap-1.5">
                            <button onclick="editItem(${item.id})" class="text-slate-400 hover:text-indigo-400 p-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                            </button>
                            <button onclick="deleteItem(${item.id})" class="text-slate-400 hover:text-rose-400 p-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                        </div>
                    </td>
                `;
                containerDesktop.appendChild(tr);
            });

            document.getElementById('totalItems').innerText = items.length;
        }

        function openModal(mode, id = null) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            modal.classList.remove('hidden');

            if (mode === 'edit' && id) {
                const item = items.find(i => i.id === id);
                title.innerText = 'Edit Barang';
                document.getElementById('itemId').value = item.id;
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemColor').value = item.color;
                document.getElementById('itemSize').value = item.size;
                document.getElementById('itemQty').value = item.qty;
            } else {
                title.innerText = 'Tambah Barang Baru';
                document.getElementById('itemForm').reset();
                document.getElementById('itemId').value = '';
            }
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function saveItem(event) {
            event.preventDefault();
            const id = document.getElementById('itemId').value;
            const name = document.getElementById('itemName').value;
            const color = document.getElementById('itemColor').value;
            const size = document.getElementById('itemSize').value;
            const qty = parseInt(document.getElementById('itemQty').value);

            if (id) {
                const index = items.findIndex(i => i.id == id);
                items[index] = { id: parseInt(id), name, color, size, qty };
            } else {
                items.push({ id: Date.now(), name, color, size, qty });
            }

            saveDataToStorage();
            closeModal();
            renderData();
        }

        function editItem(id) {
            openModal('edit', id);
        }

        function deleteItem(id) {
            if (confirm('Hapus barang ini dari daftar stok?')) {
                items = items.filter(i => i.id !== id);
                saveDataToStorage();
                renderData();
            }
        }

        // Fitur Ekspor PNG Presisi Ultra-HD
        function downloadPNG() {
            const card = document.getElementById('reportCard');
            const actionCols = document.querySelectorAll('.action-col');
            
            // Sembunyikan tombol aksi saat proses download
            actionCols.forEach(el => el.style.display = 'none');
            
            // Tambahkan style khusus agar ukuran pas & estetik
            card.classList.add('export-mode');

            html2canvas(card, {
                backgroundColor: '#111622',
                scale: 3, // Resolusi 3x HD
                useCORS: true,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Laporan-Stok-${new Date().toISOString().slice(0,10)}.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();

                // Kembalikan tampilan semula
                card.classList.remove('export-mode');
                actionCols.forEach(el => el.style.display = '');
            });
        }

        // Load data saat halaman dibuka
        renderData();
    </script>
</body>
</html>
